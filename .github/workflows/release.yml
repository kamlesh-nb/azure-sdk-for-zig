name: Azure Sdk for Zig

on:
  push:
    tags:
      - 'sdk/*'  # Pattern for component-specific tags

jobs:
  component-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [ "core", "cosmosdb" ]  # List all your components
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify component tag
        id: verify-tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/sdk/${{ matrix.component }}/* ]]; then
            echo "::warning::Skipping ${{ matrix.component }} - no matching tag"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        if: steps.verify-tag.outputs.skip == 'false'
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/sdk/${{ matrix.component }}/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up environment
        if: steps.verify-tag.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p release

      - name: Create component archives
        if: steps.verify-tag.outputs.skip == 'false'
        run: |
          COMPONENT="${{ matrix.component }}"
          
          # Create tar.gz
          tar -czf "release/${COMPONENT}-${VERSION}.tar.gz" -C "sdk" "${COMPONENT}"
          
          # Create zip
          (cd components && zip -r "../release/${COMPONENT}-${VERSION}.zip" "${COMPONENT}")
          
          # Create version file
          echo "${VERSION}" > "release/${COMPONENT}-${VERSION}.version"
          
          # Create checksum
          cd release && sha256sum ${COMPONENT}-* > ${COMPONENT}-${VERSION}.SHA256SUMS

      - name: Create GitHub Release
        if: steps.verify-tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "sdk/${{ matrix.component }}/v${{ env.VERSION }}"
          name: "${{ matrix.component }} v${{ env.VERSION }}"
          body: "Release of ${{ matrix.component }} component version ${{ env.VERSION }}"
          files: |
            release/${{ matrix.component }}-${{ env.VERSION }}.tar.gz
            release/${{ matrix.component }}-${{ env.VERSION }}.zip
            release/${{ matrix.component }}-${{ env.VERSION }}.version
            release/${{ matrix.component }}-${{ env.VERSION }}.SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}