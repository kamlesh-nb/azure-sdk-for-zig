name: Azure Sdk for Zig

on:
  push:
    tags:
      - "azure_*@*" # Pattern for mason-component@version tags

jobs:
  create-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for full git history

      - name: Parse tag information
        id: tag-info
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          COMPONENT="${TAG_NAME%%@*}"
          COMPONENT="${COMPONENT#mason-}"  # Remove mason- prefix
          VERSION="${TAG_NAME#*@}"

          echo "COMPONENT=${COMPONENT}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_NAME=mason-${COMPONENT}@${VERSION}" >> $GITHUB_ENV
          echo "ARCHIVE_BASENAME=mason-${COMPONENT}@${VERSION}" >> $GITHUB_ENV

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p release

      - name: Create component archive
        run: |
          # Create tar.gz archive of just this component
          tar -czf "release/${ARCHIVE_BASENAME}.tar.gz" \
            --transform "s|^|${ARCHIVE_BASENAME}/|" \
            "sdk/${COMPONENT}"

          # Create zip archive
          (cd sdk && zip -r "../release/${ARCHIVE_BASENAME}.zip" "${COMPONENT}")

          # Create checksum file
          cd release && sha256sum ${ARCHIVE_BASENAME}.* > ${ARCHIVE_BASENAME}.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ env.RELEASE_NAME }}"
          name: "${{ env.RELEASE_NAME }}"
          body: |
            ## ${{ env.RELEASE_NAME }}

            **Component:** ${{ env.COMPONENT }}
            **Version:** ${{ env.VERSION }}
            **Release Date:** $(date +'%Y-%m-%d')

            ### Downloads
            - [${ARCHIVE_BASENAME}.tar.gz](${ARCHIVE_BASENAME}.tar.gz)
            - [${ARCHIVE_BASENAME}.zip](${ARCHIVE_BASENAME}.zip)

            ### Checksums
            ```sha256
            $(cat release/${ARCHIVE_BASENAME}.sha256)
            ```
          files: |
            release/${{ env.ARCHIVE_BASENAME }}.tar.gz
            release/${{ env.ARCHIVE_BASENAME }}.zip
            release/${{ env.ARCHIVE_BASENAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
