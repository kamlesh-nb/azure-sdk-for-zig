name: Azure Sdk for Zig
on:
  push:
    tags:
      - 'azure_*'  # Now looking for mason-* tags

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract component and version
        id: extract
        run: |
          # Extract component name and version from tag (mason-component@0.1.0)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          COMPONENT=$(echo $TAG_NAME | cut -d '@' -f 1 | sed 's/mason-//')
          VERSION=$(echo $TAG_NAME | cut -d '@' -f 2)
          
          echo "COMPONENT=$COMPONENT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p release

      - name: Create archives
        run: |
          # Create tar.gz
          tar -czf "release/${{ env.ARCHIVE_NAME }}.tar.gz" -C "sdk" "${{ env.COMPONENT }}"
          
          # Create zip
          (cd sdk && zip -r "../release/${{ env.ARCHIVE_NAME }}.zip" "${{ env.COMPONENT }}")
          
          # Create checksum
          cd release && sha256sum ${{ env.ARCHIVE_NAME }}.* > ${{ env.ARCHIVE_NAME }}.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ env.RELEASE_NAME }}"
          name: "${{ env.RELEASE_NAME }}"
          body: |
            ## ${{ env.RELEASE_NAME }}
            
            **Component:** ${{ env.COMPONENT }}
            **Version:** ${{ env.VERSION }}
            
            ### Downloads
            - [${{ env.ARCHIVE_NAME }}.tar.gz](${{ env.ARCHIVE_NAME }}.tar.gz)
            - [${{ env.ARCHIVE_NAME }}.zip](${{ env.ARCHIVE_NAME }}.zip)
            
            ### Checksum
            ```sha256
            $(cat release/${{ env.ARCHIVE_NAME }}.sha256)
            ```
          files: |
            release/${{ env.ARCHIVE_NAME }}.tar.gz
            release/${{ env.ARCHIVE_NAME }}.zip
            release/${{ env.ARCHIVE_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}