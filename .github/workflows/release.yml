name: Azure Sdk for Zig

on:
  push:
    tags:
      - "sdk/*"

jobs:
  sdk-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ["core", "cosmosdb"] # Update with your components
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SDK component tag
        id: verify-tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/sdk/${{ matrix.component }}/* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        if: steps.verify-tag.outputs.skip == 'false'
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/sdk/${{ matrix.component }}/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_NAME=azure_${{ matrix.component }}@${VERSION}" >> $GITHUB_ENV

      - name: Set up environment
        if: steps.verify-tag.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p release

      - name: Create component archives
        if: steps.verify-tag.outputs.skip == 'false'
        run: |
          # Create tar.gz
          tar -czf "release/${{ env.RELEASE_NAME }}.tar.gz" -C "sdk" "${{ matrix.component }}"

          # Create zip
          (cd sdk && zip -r "../release/${{ env.RELEASE_NAME }}.zip" "${{ matrix.component }}")

          # Create checksum
          cd release && sha256sum ${{ env.RELEASE_NAME }}.* > ${{ env.RELEASE_NAME }}.sha256

      - name: Create GitHub Release
        if: steps.verify-tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ matrix.component }}/v${{ env.VERSION }}"
          name: "${{ env.RELEASE_NAME }}"
          body: |
            ## ${{ env.RELEASE_NAME }}

            **Release Date:** $(date +'%Y-%m-%d')

            ### Artifacts
            - [${{ env.RELEASE_NAME }}.tar.gz](${{ env.RELEASE_NAME }}.tar.gz)
            - [${{ env.RELEASE_NAME }}.zip](${{ env.RELEASE_NAME }}.zip)

            ### Checksum
            ```sha256
            $(cat release/${{ env.RELEASE_NAME }}.sha256)
            ```
          files: |
            release/${{ env.RELEASE_NAME }}.tar.gz
            release/${{ env.RELEASE_NAME }}.zip
            release/${{ env.RELEASE_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
